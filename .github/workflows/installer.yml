name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/installer.yml'
      - 'src/**'
      - 'installer/**'
      - 'scripts/**'
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test extension retry logic
        run: node tests/extension.test.cjs
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Publish and compile installer
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - name: Smoke test install and uninstall
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'AutoLogout-Smoke'
          $exe = (Resolve-Path 'out/installer/AutoLogout-0.2.0-Setup.exe').Path
          $p = Start-Process -FilePath $exe -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$target`"") -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw "Install failed: $($p.ExitCode)" }
          foreach ($file in @('app/AutoLogout.App.exe', 'host/AutoLogout.Host.exe', 'extension/manifest.json', 'unins000.exe')) {
            if (!(Test-Path (Join-Path $target $file))) { throw "Missing installed file: $file" }
          }
          $run = Get-ItemPropertyValue 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' 'AutoLogout' -ErrorAction SilentlyContinue
          if ($null -ne $run) { throw 'Installer unexpectedly enabled Windows startup' }
          $p = Start-Process -FilePath (Join-Path $target 'unins000.exe') -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw "Uninstall failed: $($p.ExitCode)" }
          if (Test-Path (Join-Path $target 'app/AutoLogout.App.exe')) { throw 'App remains after uninstall' }
      - name: Record installer hash
        shell: pwsh
        run: |
          $exe = 'out/installer/AutoLogout-0.2.0-Setup.exe'
          if (!(Test-Path $exe)) { throw 'Installer missing' }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "$hash  AutoLogout-0.2.0-Setup.exe" | Set-Content out/installer/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AutoLogout-0.2.0-Windows-x64-Setup
          path: out/installer/*
          if-no-files-found: error
          retention-days: 30
